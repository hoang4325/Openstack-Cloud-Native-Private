
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: demo-web
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/hoang4325/Openstack-Cloud-Native-Private.git
    targetRevision: master
    path: kubernetes/apps/demo-web

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
