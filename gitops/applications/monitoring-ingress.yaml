apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-tailnet
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80

    - host: prometheus.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus
                port:
                  number: 9090
