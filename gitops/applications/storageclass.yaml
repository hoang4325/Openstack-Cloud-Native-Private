# Safe to create after the existing cinder-lvm StorageClass matches Git.
# Manual sync intentionally: review adoption before enabling auto-sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storageclass-cinder
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hoang4325/Openstack-Cloud-Native-Private.git
    targetRevision: master
    path: kubernetes/storage/storageclass
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
