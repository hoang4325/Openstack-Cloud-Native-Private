
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.14.1

    helm:
      releaseName: monitoring

      valuesObject:

        # Prometheus Operator
        prometheusOperator:
          nodeSelector:
            kubernetes.io/hostname: k8s-monitoring-01

        # Prometheus
        prometheus:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - prometheus.lab.internal
            paths:
              - /
            pathType: Prefix

          prometheusSpec:
            nodeSelector:
              kubernetes.io/hostname: k8s-monitoring-01

            retention: 3d
            retentionSize: 2GiB

            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1Gi

            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: cinder-lvm
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 3Gi

        # Grafana
        grafana:
          enabled: true

          nodeSelector:
            kubernetes.io/hostname: k8s-monitoring-01

          persistence:
            enabled: true
            storageClassName: cinder-lvm
            accessModes:
              - ReadWriteOnce
            size: 1Gi

          service:
            type: ClusterIP

          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.lab.internal
            path: /

        # Alertmanager
        alertmanager:
          enabled: true

          alertmanagerSpec:
            nodeSelector:
              kubernetes.io/hostname: k8s-monitoring-01

            alertmanagerConfigSelector:
              matchLabels:
                alertmanager: student-telegram

            alertmanagerConfigNamespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: student

            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: cinder-lvm
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Prune=false
      - ServerSideApply=true
