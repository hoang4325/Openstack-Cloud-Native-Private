# FUTURE MIGRATION ONLY: DO NOT APPLY WHILE MANUAL HELM RELEASE
# cinder-csi IS MANAGED BY HELM. Plan/adopt ownership first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cinder-csi
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/cloud-provider-openstack
      chart: openstack-cinder-csi
      targetRevision: 2.36.2
      helm:
        releaseName: cinder-csi
        valueFiles:
          - $values/helm/storage/cinder-csi-values.yaml
    - repoURL: https://github.com/hoang4325/Openstack-Cloud-Native-Private.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
