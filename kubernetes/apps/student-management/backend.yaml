apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: student
  labels:
    app: student-api
spec:
  type: ClusterIP
  selector:
    app: student-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-api
  namespace: student
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: student-api

  template:
    metadata:
      labels:
        app: student-api

    spec:
      nodeSelector:
        workload: student-app

      containers:
        - name: api
          image: hoang4325/student-app-api:9
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: student-mongo-auth
                  key: uri

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20