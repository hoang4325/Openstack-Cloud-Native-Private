apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-web
  namespace: student
  labels:
    app: student-web

spec:
  replicas: 1

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: student-web

  template:
    metadata:
      labels:
        app: student-web

    spec:
      nodeSelector:
        workload: student-app

      containers:
        - name: frontend
          image: hoang4325/student-app-web:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: student
  labels:
    app: student-web

spec:
  type: ClusterIP

  selector:
    app: student-web

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP