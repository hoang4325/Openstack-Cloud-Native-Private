apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: student-api-alerts
  namespace: student
  labels:
    release: monitoring
spec:
  groups:
    - name: student-api.rules
      rules:
        - alert: StudentAPIDown
          expr: |
            up{namespace="student",service="api"} == 0
            or absent(up{namespace="student",service="api"})
          for: 2m
          labels:
            severity: critical
            namespace: student
          annotations:
            summary: "Student API DOWN"
            description: "Prometheus không thể scrape Student API trong 2 phút."

        - alert: StudentAPIHigh5xx
          expr: |
            sum(
              increase(
                http_server_requests_seconds_count{
                  namespace="student",
                  service="api",
                  status=~"5..",
                  uri!~"/actuator/.*"
                }[5m]
              )
            ) > 5
          for: 1m
          labels:
            severity: warning
            namespace: student
          annotations:
            summary: "Student API có nhiều lỗi HTTP 5xx"
            description: "API ghi nhận trên 5 lỗi HTTP 5xx trong cửa sổ 5 phút."
