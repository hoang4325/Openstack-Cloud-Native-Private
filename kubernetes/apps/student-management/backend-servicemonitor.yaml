apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: student-api
  namespace: student
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - student

  selector:
    matchLabels:
      app: student-api

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
