apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-management
  namespace: student
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"

spec:
  ingressClassName: traefik

  rules:
    - host: student.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80