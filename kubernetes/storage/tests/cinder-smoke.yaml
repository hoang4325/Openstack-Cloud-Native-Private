# Opt-in only. Never point an auto-sync Argo CD Application at this tests/ directory.
apiVersion: v1
kind: Namespace
metadata:
  name: storage-smoke
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cinder-smoke-pvc
  namespace: storage-smoke
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cinder-lvm
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: cinder-smoke-pod
  namespace: storage-smoke
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-01
  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - while true; do sleep 3600; done
      volumeMounts:
        - name: storage
          mountPath: /data
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: cinder-smoke-pvc
