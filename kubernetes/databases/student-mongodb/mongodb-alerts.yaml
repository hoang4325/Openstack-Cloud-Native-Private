apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mongodb-alerts
  namespace: student
  labels:
    release: monitoring
spec:
  groups:
    - name: mongodb.rules
      rules:
        - alert: MongoDBDown
          expr: mongodb_up{namespace="student",job="mongodb-exporter"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "MongoDB không kết nối được"
            description: "MongoDB Exporter không kết nối được MongoDB trong 2 phút."

        - alert: MongoDBExporterDown
          expr: |
            (up{namespace="student",job="mongodb-exporter"} == 0)
            or absent(up{namespace="student",job="mongodb-exporter"})
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "MongoDB Exporter không hoạt động"
            description: "Prometheus không scrape được MongoDB Exporter."

        - alert: MongoDBPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="student",
              pod="mongodb-0",
              container="mongodb"
            }[10m]) > 2
          labels:
            severity: warning
          annotations:
            summary: "MongoDB Pod restart nhiều lần"
            description: "MongoDB restart quá 2 lần trong 10 phút."

        - alert: MongoDBPVCUsageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{
                namespace="student",
                persistentvolumeclaim="mongo-data-mongodb-0"
              }
              /
              kubelet_volume_stats_capacity_bytes{
                namespace="student",
                persistentvolumeclaim="mongo-data-mongodb-0"
              }
            ) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "MongoDB PVC gần đầy"
            description: "PVC MongoDB đã sử dụng trên 80% dung lượng."

        - alert: MongoDBBackupJobFailed
          expr: |
            (
              kube_job_failed{
                namespace="student",
                job_name=~"mongodb-daily-backup-.*",
                condition="true"
              } == 1
            )
            and on(namespace, job_name)
            (
              time() - kube_job_status_start_time{
                namespace="student",
                job_name=~"mongodb-daily-backup-.*"
              } < 86400
            )
          for: 1m
          labels:
            severity: critical
            namespace: student
          annotations:
            summary: "MongoDB Backup Failed"
            description: "Job backup MongoDB trong 24h qua da that bai."

        - alert: MongoDBBackupStale
          expr: |
            (
              (
                time() - kube_cronjob_status_last_successful_time{
                  namespace="student",
                  cronjob="mongodb-daily-backup"
                } > 93600
              )
              or
              (
                (
                  time() - kube_cronjob_status_last_schedule_time{
                    namespace="student",
                    cronjob="mongodb-daily-backup"
                  } > 3600
                )
                unless on(namespace, cronjob)
                kube_cronjob_status_last_successful_time{
                  namespace="student",
                  cronjob="mongodb-daily-backup"
                }
              )
            )
            and on(namespace, cronjob)
            (
              kube_cronjob_spec_suspend{
                namespace="student",
                cronjob="mongodb-daily-backup"
              } == 0
            )
          for: 10m
          labels:
            severity: critical
            namespace: student
          annotations:
            summary: "MongoDB Backup Stale"
            description: "Khong co backup thanh cong dung han."
