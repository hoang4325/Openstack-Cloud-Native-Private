apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: mongodb-telegram
  namespace: student
  labels:
    alertmanager: student-telegram
spec:
  route:
    receiver: student-telegram
    groupBy:
      - alertname
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 12h
    matchers:
      - name: severity
        matchType: "=~"
        value: "warning|critical"

  receivers:
    - name: student-telegram
      telegramConfigs:
        - botToken:
            name: alertmanager-telegram-bot
            key: token
          chatID: 8665125926
          sendResolved: true
          message: |
            {{ .Status | toUpper }} - {{ .CommonLabels.alertname }}
            {{ range .Alerts }}
            Summary: {{ .Annotations.summary }}
            Description: {{ .Annotations.description }}
            {{ end }}
