apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: student
spec:
  clusterIP: None
  selector: 
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: student
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: student
spec:
  serviceName: mongodb-headless
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb
    spec:
      nodeSelector:
        workload: student-app

      terminationGracePeriodSeconds: 60

      containers:
        - name: mongodb
          image: mongo:5.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 27017
              name: mongodb

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: student-mongo-auth
                  key: username

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-mongo-auth
                  key: password

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10

          volumeMounts:
            - name: mongo-data
              mountPath: /data/db

  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: cinder-lvm
        resources:
          requests:
            storage: 5Gi
