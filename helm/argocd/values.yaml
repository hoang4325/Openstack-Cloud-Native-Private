
# Argo CD for OpenStack Private Cloud Lab
# Chart version: 10.9.6
# Deployment mode: Non-HA

global:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-01

controller:
  replicas: 1

  # kube-prometheus-stack reconciliation exceeds the former 384Mi limit.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

server:
  replicas: 1

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

repoServer:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 384Mi

redis:
  enabled: true

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

redis-ha:
  enabled: false

redisSecretInit:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 0
