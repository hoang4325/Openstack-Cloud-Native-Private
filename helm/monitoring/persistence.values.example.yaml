# OPT-IN OVERLAY. Do not reference this file in GitOps until migration is planned.
# Overlay onto existing helm/monitoring/values.yaml via Argo CD valueFiles.
# Initial lab volumes: Prometheus 10Gi + Grafana 3Gi + Alertmanager 2Gi.
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: cinder-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  persistence:
    enabled: true
    storageClassName: cinder-lvm
    accessModes:
      - ReadWriteOnce
    size: 3Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: cinder-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
