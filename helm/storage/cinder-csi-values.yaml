# Matches Helm release cinder-csi currently installed manually in kube-system.
# Chart: cpo/openstack-cinder-csi 2.36.2 (appVersion v1.36.0).
# Credentials stay in existing Kubernetes Secret, never in Git.
secret:
  enabled: true
  create: false
  hostMount: false
  name: cinder-csi-cloud-config
  filename: cloud.conf

# StorageClass is managed separately through GitOps.
storageClass:
  enabled: false

clusterID: openstack-k8s-lab
