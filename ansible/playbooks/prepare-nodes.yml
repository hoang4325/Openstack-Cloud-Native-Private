# Chuẩn bị các node Ubuntu cho runtime container và Kubernetes.
- name: Prepare Ubuntu nodes for Kubernetes
  hosts: k8s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == k8s_supported_os
          - ansible_facts['distribution_version'] == k8s_supported_os_version
        fail_msg: >-
          This playbook requires {{ k8s_supported_os }}
          {{ k8s_supported_os_version }}.

    - name: Disable active swap
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_facts['swaptotal_mb'] | default(0) | int > 0

    - name: Disable swap persistently in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!\s*#)(\s*\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Persist required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure Kubernetes networking sysctl
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
        owner: root
        group: root
        mode: "0644"
      notify: Apply Kubernetes sysctl

  handlers:
    - name: Apply Kubernetes sysctl
      ansible.builtin.command:
        cmd: sysctl --load=/etc/sysctl.d/99-kubernetes.conf
      changed_when: true
