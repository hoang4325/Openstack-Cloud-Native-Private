
---
- name: Install Helm on Kubernetes Control Plane
  hosts: k8s_control
  become: true
  gather_facts: true

  tasks:
    - name: Verify system architecture
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: "This Helm installation requires x86_64/amd64."

    - name: Download Helm binary archive
      ansible.builtin.get_url:
        url: "{{ helm_url }}"
        dest: "/tmp/{{ helm_archive }}"
        mode: "0644"

    - name: Download Helm SHA256 checksums
      ansible.builtin.get_url:
        url: "{{ helm_url }}.sha256sum"
        dest: "/tmp/{{ helm_archive }}.sha256sum"
        mode: "0644"

    - name: Verify Helm archive checksum
      ansible.builtin.command:
        argv:
          - sha256sum
          - --check
          - --status
          - "/tmp/{{ helm_archive }}.sha256sum"
      args:
        chdir: /tmp
      changed_when: false

    - name: Create versioned Helm installation directory
      ansible.builtin.file:
        path: "{{ helm_install_dir }}"
        state: directory
        mode: "0755"

    - name: Extract Helm binary
      ansible.builtin.unarchive:
        src: "/tmp/{{ helm_archive }}"
        dest: "{{ helm_install_dir }}"
        remote_src: true
        creates: "{{ helm_install_dir }}/linux-amd64/helm"

    - name: Install Helm executable
      ansible.builtin.copy:
        src: "{{ helm_install_dir }}/linux-amd64/helm"
        dest: "{{ helm_binary_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Verify Helm installation
      ansible.builtin.command:
        cmd: "{{ helm_binary_path }} version --short"
      register: helm_version_result
      changed_when: false

    - name: Display installed Helm version
      ansible.builtin.debug:
        var: helm_version_result.stdout
