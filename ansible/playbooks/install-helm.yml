
---
- name: Install Helm on Kubernetes Control Plane
  hosts: k8s_control
  become: true
  gather_facts: true

  vars:
    helm_version: "v4.3.0"
    helm_archive: "helm-{{ helm_version }}-linux-amd64.tar.gz"
    helm_url: "https://get.helm.sh/{{ helm_archive }}"
    helm_install_dir: "/opt/helm/{{ helm_version }}"

  tasks:
    - name: Verify system architecture
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] == 'x86_64'

    - name: Download Helm binary archive
      ansible.builtin.get_url:
        url: "{{ helm_url }}"
        dest: "/tmp/{{ helm_archive }}"
        mode: "0644"

    - name: Download Helm SHA256 checksums
      ansible.builtin.get_url:
        url: "{{ helm_url }}.sha256sum"
        dest: "/tmp/{{ helm_archive }}.sha256sum"
        mode: "0644"

    - name: Verify archive checksum
      ansible.builtin.command:
        cmd: "sha256sum -c {{ helm_archive }}.sha256sum"
        chdir: /tmp
      changed_when: false

    - name: Create versioned Helm installation directory
      ansible.builtin.file:
        path: "{{ helm_install_dir }}"
        state: directory
        mode: "0755"

    - name: Extract Helm binary
      ansible.builtin.unarchive:
        src: "/tmp/{{ helm_archive }}"
        dest: "{{ helm_install_dir }}"
        remote_src: true
        creates: "{{ helm_install_dir }}/linux-amd64/helm"

    - name: Install Helm executable
      ansible.builtin.copy:
        src: "{{ helm_install_dir }}/linux-amd64/helm"
        dest: /usr/local/bin/helm
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Verify Helm installation
      ansible.builtin.command:
        cmd: helm version --short
      register: helm_version_result
      changed_when: false

    - name: Display installed Helm version
      ansible.builtin.debug:
        var: helm_version_result.stdout
