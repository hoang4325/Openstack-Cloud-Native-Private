# Khởi tạo control plane Kubernetes bằng kubeadm.
- name: Initialize Kubernetes Control Plane
  hosts: k8s_control
  become: true
  gather_facts: true

  tasks:
    - name: Initialize Kubernetes with kubeadm
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - "--kubernetes-version={{ kubernetes_version }}"
          - "--apiserver-advertise-address={{ node_ip }}"
          - "--pod-network-cidr={{ k8s_pod_cidr }}"
          - "--service-cidr={{ k8s_service_cidr }}"
          - "--cri-socket={{ k8s_cri_socket }}"
          - "--node-name={{ inventory_hostname }}"
        creates: /etc/kubernetes/admin.conf

    - name: Create kubectl configuration directory
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Configure kubectl for ubuntu user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"
