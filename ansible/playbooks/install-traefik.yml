
---
- name: Install Traefik Ingress Controller
  hosts: k8s_control
  become: false
  gather_facts: false

  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:
    - name: Create Traefik configuration directory
      ansible.builtin.file:
        path: "{{ traefik_values_remote_path | dirname }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Upload custom Traefik values
      ansible.builtin.copy:
        src: "{{ traefik_values_local_path }}"
        dest: "{{ traefik_values_remote_path }}"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Add official Traefik Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ traefik_helm_repo_name }}"
          - "{{ traefik_helm_repo_url }}"
          - --force-update
      changed_when: false

    - name: Update Traefik Helm repository metadata
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
          - "{{ traefik_helm_repo_name }}"
      changed_when: false

    - name: Validate and render Traefik chart
      ansible.builtin.command:
        argv:
          - helm
          - template
          - "{{ traefik_release_name }}"
          - "{{ traefik_helm_repo_name }}/traefik"
          - --version
          - "{{ traefik_chart_version }}"
          - --namespace
          - "{{ traefik_namespace }}"
          - -f
          - "{{ traefik_values_remote_path }}"
      register: rendered_chart
      changed_when: false

    - name: Save rendered Traefik manifests
      ansible.builtin.copy:
        content: "{{ rendered_chart.stdout }}\n"
        dest: /tmp/traefik-rendered.yaml
        mode: "0644"

    - name: Deploy or upgrade Traefik
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ traefik_release_name }}"
          - "{{ traefik_helm_repo_name }}/traefik"
          - --namespace
          - "{{ traefik_namespace }}"
          - --create-namespace
          - --version
          - "{{ traefik_chart_version }}"
          - -f
          - "{{ traefik_values_remote_path }}"
          - --wait
          - --timeout
          - 600s
      register: traefik_result

    - name: Show Helm deployment result
      ansible.builtin.debug:
        var: traefik_result.stdout_lines
