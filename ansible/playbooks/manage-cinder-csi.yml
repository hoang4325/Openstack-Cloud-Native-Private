
---
# Safe repeated install/verification for an EXISTING Cinder CSI Helm release.
# Does not create OpenStack credentials or mutate an existing Secret.
- name: Manage Cinder CSI safely
  hosts: k8s_control
  gather_facts: false
  become: false

  vars:
    cinder_csi_chart_version: "2.36.2"
    cinder_csi_release_name: "cinder-csi"
    cinder_csi_namespace: "kube-system"
    cinder_csi_secret_name: "cinder-csi-cloud-config"

    cinder_csi_local_values: "{{ playbook_dir }}/../../helm/storage/cinder-csi-values.yaml"
    cinder_csi_remote_values: "/tmp/cinder-csi-values-managed.yaml"

    cinder_csi_helm_repo_name: "cpo"
    cinder_csi_helm_repo_url: "https://kubernetes.github.io/cloud-provider-openstack"
    cinder_csi_chart_name: "openstack-cinder-csi"

    # Explicit opt-in required to upgrade an existing release.
    cinder_csi_allow_upgrade: false

  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:
    - name: Verify Kubernetes access
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - namespace
          - "{{ cinder_csi_namespace }}"
      changed_when: false

    - name: Verify Cinder cloud-config Secret exists
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ cinder_csi_namespace }}"
          - get
          - secret
          - "{{ cinder_csi_secret_name }}"
          - -o
          - name
      changed_when: false
      no_log: true

    - name: Verify cloud.conf key exists without exposing its content
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ cinder_csi_namespace }}"
          - get
          - secret
          - "{{ cinder_csi_secret_name }}"
          - -o
          - 'go-template={% raw %}{{ if index .data "cloud.conf" }}yes{{ else }}no{{ end }}{% endraw %}'
      register: cinder_csi_cloud_key
      changed_when: false
      no_log: true

    - name: Refuse to continue with incomplete cloud Secret
      ansible.builtin.assert:
        that:
          - cinder_csi_cloud_key.stdout == "yes"
        fail_msg: >-
          Cinder Secret lacks cloud.conf.
          Prepare it securely before running this playbook.
      no_log: true

    - name: Upload version-controlled non-secret chart values
      ansible.builtin.copy:
        src: "{{ cinder_csi_local_values }}"
        dest: "{{ cinder_csi_remote_values }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Add upstream Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ cinder_csi_helm_repo_name }}"
          - "{{ cinder_csi_helm_repo_url }}"
          - --force-update
      changed_when: false

    - name: Update Helm repository metadata
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
          - "{{ cinder_csi_helm_repo_name }}"
      changed_when: false

    - name: Check existing Helm release
      ansible.builtin.command:
        argv:
          - helm
          - status
          - "{{ cinder_csi_release_name }}"
          - -n
          - "{{ cinder_csi_namespace }}"
          - -o
          - json
      register: cinder_csi_release_status
      failed_when: false
      changed_when: false

    - name: Refuse ambiguous Helm status errors
      ansible.builtin.assert:
        that:
          - >-
            cinder_csi_release_status.rc == 0 or
            'release: not found' in
            (cinder_csi_release_status.stderr | default('') | lower)
        fail_msg: >-
          Helm status failed unexpectedly.
          Review the Helm error before proceeding.

    - name: Render CSI manifests without applying them
      ansible.builtin.command:
        argv:
          - helm
          - template
          - "{{ cinder_csi_release_name }}"
          - "{{ cinder_csi_helm_repo_name }}/{{ cinder_csi_chart_name }}"
          - --version
          - "{{ cinder_csi_chart_version }}"
          - --namespace
          - "{{ cinder_csi_namespace }}"
          - --values
          - "{{ cinder_csi_remote_values }}"
      register: cinder_csi_rendered
      changed_when: false
      no_log: true

    - name: Check chart version of an existing release
      ansible.builtin.command:
        argv:
          - helm
          - list
          - -n
          - "{{ cinder_csi_namespace }}"
          - --filter
          - "^{{ cinder_csi_release_name }}$"
          - -o
          - json
      register: cinder_csi_releases
      changed_when: false
      when: cinder_csi_release_status.rc == 0

    - name: Refuse unexpected chart version without explicit upgrade approval
      ansible.builtin.assert:
        that:
          - (cinder_csi_releases.stdout | from_json | length) == 1
          - >-
            (cinder_csi_releases.stdout | from_json)[0].chart
            == 'openstack-cinder-csi-' ~ cinder_csi_chart_version
        fail_msg: >-
          Existing release differs from the pinned chart version.
          Review the release before upgrading.
      when:
        - cinder_csi_release_status.rc == 0
        - not (cinder_csi_allow_upgrade | bool)

    - name: Explain safe no-op for existing release
      ansible.builtin.debug:
        msg: >-
          Existing Cinder CSI release retained.
          Review the Helm changes before explicitly enabling an upgrade.
      when:
        - cinder_csi_release_status.rc == 0
        - not (cinder_csi_allow_upgrade | bool)

    - name: Install CSI if absent or upgrade when explicitly approved
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ cinder_csi_release_name }}"
          - "{{ cinder_csi_helm_repo_name }}/{{ cinder_csi_chart_name }}"
          - -n
          - "{{ cinder_csi_namespace }}"
          - --version
          - "{{ cinder_csi_chart_version }}"
          - -f
          - "{{ cinder_csi_remote_values }}"
          - --wait
          - --timeout
          - 10m
      register: cinder_csi_install
      changed_when: >-
        'has been installed' in cinder_csi_install.stdout or
        'has been upgraded' in cinder_csi_install.stdout
      when: >-
        cinder_csi_release_status.rc != 0 or
        (cinder_csi_allow_upgrade | bool)

    - name: Verify registered CSI driver
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - csidriver
          - cinder.csi.openstack.org
          - -o
          - name
      changed_when: false

    - name: Verify GitOps-owned StorageClass exists
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - storageclass
          - cinder-lvm
          - -o
          - name
      changed_when: false
