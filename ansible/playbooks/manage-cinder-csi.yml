---
# Safe repeated install/verification for EXISTING Cinder CSI Helm release.
# Does not create OpenStack credentials or mutate an existing secret.
- name: Manage Cinder CSI safely
  hosts: k8s_control
  gather_facts: false
  become: false
  vars:
    chart_version: "2.36.2"
    release_name: cinder-csi
    release_namespace: kube-system
    secret_name: cinder-csi-cloud-config
    local_values: "{{ playbook_dir }}/../../helm/storage/cinder-csi-values.yaml"
    remote_values: /tmp/cinder-csi-values-managed.yaml
    # Required for a new cluster: create secret separately, out of Git.
    # Explicit opt-in needed to change existing release.
    cinder_csi_allow_upgrade: false

  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

  tasks:
    - name: Verify Kubernetes access
      ansible.builtin.command:
        argv: [kubectl, get, namespace, "{{ release_namespace }}"]
      changed_when: false

    - name: Verify Cinder cloud-config secret exists without exposing content
      ansible.builtin.command:
        argv: [kubectl, -n, "{{ release_namespace }}", get, secret, "{{ secret_name }}", -o, name]
      changed_when: false
      no_log: true

    - name: Verify cloud.conf key exists (output not logged)
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ release_namespace }}"
          - get
          - secret
          - "{{ secret_name }}"
          - -o
          - 'go-template={% raw %}{{ if index .data "cloud.conf" }}yes{{ else }}no{{ end }}{% endraw %}'
      register: cloud_key
      changed_when: false
      no_log: true

    - name: Refuse to continue with incomplete cloud secret
      ansible.builtin.assert:
        that: cloud_key.stdout == "yes"
        fail_msg: "Cinder secret lacks cloud.conf. Prepare it securely before running."
      no_log: true

    - name: Upload version-controlled non-secret chart values
      ansible.builtin.copy:
        src: "{{ local_values }}"
        dest: "{{ remote_values }}"
        mode: "0600"

    - name: Add upstream chart repository
      ansible.builtin.command:
        argv: [helm, repo, add, cpo, https://kubernetes.github.io/cloud-provider-openstack, --force-update]
      changed_when: false

    - name: Update chart index
      ansible.builtin.command:
        argv: [helm, repo, update, cpo]
      changed_when: false

    - name: Check release presence
      ansible.builtin.command:
        argv: [helm, status, "{{ release_name }}", -n, "{{ release_namespace }}", -o, json]
      register: release_status
      failed_when: false
      changed_when: false

    - name: Refuse ambiguous Helm error
      ansible.builtin.assert:
        that:
          - "release_status.rc == 0 or ('release: not found' in (release_status.stderr | default('') | lower))"
        fail_msg: "helm status failed unexpectedly; do not install over unknown state."
    - name: Render CSI manifests without applying them
      ansible.builtin.command:
        argv:
          - helm
          - template
          - "{{ release_name }}"
          - cpo/openstack-cinder-csi
          - --version
          - "{{ chart_version }}"
          - --namespace
          - "{{ release_namespace }}"
          - --values
          - "{{ remote_values }}"
      register: rendered
      changed_when: false
      no_log: true

    - name: Check chart version of an existing release
      ansible.builtin.command:
        argv: [helm, list, -n, "{{ release_namespace }}", --filter, "^{{ release_name }}$", -o, json]
      register: releases
      changed_when: false
      when: release_status.rc == 0

    - name: Refuse unexpected chart version before no-op
      ansible.builtin.assert:
        that:
          - (releases.stdout | from_json | length) == 1
          - ((releases.stdout | from_json)[0].chart) == ("openstack-cinder-csi-" ~ chart_version)
        fail_msg: "Existing release differs from pinned chart; perform a manual review."
      when: release_status.rc == 0 and not (cinder_csi_allow_upgrade | bool)

    - name: Explain safe no-op when CSI already exists
      ansible.builtin.debug:
        msg: "Existing CSI release retained. To intentionally upgrade, set -e cinder_csi_allow_upgrade=true after reviewing helm diff."
      when: release_status.rc == 0 and not (cinder_csi_allow_upgrade | bool)

    - name: Install CSI if absent, or upgrade only when explicitly approved
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ release_name }}"
          - cpo/openstack-cinder-csi
          - -n
          - "{{ release_namespace }}"
          - --version
          - "{{ chart_version }}"
          - -f
          - "{{ remote_values }}"
          - --wait
          - --timeout
          - 10m
      register: cinder_csi_install
      changed_when: >-
        'has been installed' in cinder_csi_install.stdout or
        'has been upgraded' in cinder_csi_install.stdout
      when: release_status.rc != 0 or (cinder_csi_allow_upgrade | bool)

    - name: Verify registered CSI driver
      ansible.builtin.command:
        argv: [kubectl, get, csidriver, cinder.csi.openstack.org, -o, name]
      changed_when: false

    - name: Verify GitOps-owned StorageClass exists
      ansible.builtin.command:
        argv: [kubectl, get, storageclass, cinder-lvm, -o, name]
      changed_when: false
