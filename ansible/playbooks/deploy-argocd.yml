
- name: Deploy Argo CD with Helm
  hosts: k8s_control
  become: false
  gather_facts: false

  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  tasks:
    - name: Verify Kubernetes API
      ansible.builtin.command:
        cmd: kubectl get nodes
      register: kubernetes_nodes
      changed_when: false

    - name: Print Kubernetes nodes
      ansible.builtin.debug:
        var: kubernetes_nodes.stdout_lines

    - name: Verify Helm installation
      ansible.builtin.command:
        cmd: helm version --short
      changed_when: false

    - name: Create Argo CD configuration directory
      ansible.builtin.file:
        path: "{{ argocd_values_remote_path | dirname }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Helm values to control plane
      ansible.builtin.copy:
        src: "{{ argocd_values_local_path }}"
        dest: "{{ argocd_values_remote_path }}"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Add Argo Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ argocd_helm_repo_name }}"
          - "{{ argocd_helm_repo_url }}"
          - --force-update
      changed_when: false

    - name: Update Argo Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
          - "{{ argocd_helm_repo_name }}"
      changed_when: false

    - name: Verify chart version exists
      ansible.builtin.command:
        argv:
          - helm
          - show
          - chart
          - "{{ argocd_helm_repo_name }}/argo-cd"
          - --version
          - "{{ argocd_chart_version }}"
      changed_when: false

    - name: Render Argo CD manifests
      ansible.builtin.command:
        argv:
          - helm
          - template
          - "{{ argocd_release_name }}"
          - "{{ argocd_helm_repo_name }}/argo-cd"
          - --version
          - "{{ argocd_chart_version }}"
          - --namespace
          - "{{ argocd_namespace }}"
          - --values
          - "{{ argocd_values_remote_path }}"
      register: argocd_render
      changed_when: false

    - name: Save rendered Argo CD manifests
      ansible.builtin.copy:
        content: "{{ argocd_render.stdout }}\n"
        dest: /tmp/argocd-rendered.yaml
        mode: "0644"

    - name: Install or upgrade Argo CD
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ argocd_release_name }}"
          - "{{ argocd_helm_repo_name }}/argo-cd"
          - --namespace
          - "{{ argocd_namespace }}"
          - --create-namespace
          - --version
          - "{{ argocd_chart_version }}"
          - --values
          - "{{ argocd_values_remote_path }}"
          - --wait
          - --timeout
          - 10m
      register: helm_result

    - name: Show deployment result
      ansible.builtin.debug:
        var: helm_result.stdout_lines
