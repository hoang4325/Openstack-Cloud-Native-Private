---
# Kubernetes
kubernetes_version: "v1.36.5"
kubernetes_minor: "v1.36"
k8s_cri_socket: "unix:///run/containerd/containerd.sock"

# Kubernetes networking
k8s_node_cidr: "10.20.0.0/24"
k8s_pod_cidr: "192.168.0.0/16"
k8s_service_cidr: "10.96.0.0/12"

# crictl
crictl_version: "v1.36.0"
crictl_sha256: "83855e114566a8a8c44c548d515670f51de3a5e1da8b2effb59870e2f10c25a3"
crictl_archive: "crictl-{{ crictl_version }}-linux-amd64.tar.gz"
crictl_url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/{{ crictl_archive }}"
crictl_install_path: "/usr/local/bin/crictl"

# Containerd
containerd_config_path: "/etc/containerd/config.toml"
containerd_config_dir: "/etc/containerd"

# Calico
calico_version: "v3.33.0"

k8s_supported_os: "Ubuntu"
k8s_supported_os_version: "24.04"

# Argo CD
argocd_chart_version: "10.9.6"
argocd_namespace: "argocd"
argocd_release_name: "argocd"
argocd_helm_repo_name: "argo"
argocd_helm_repo_url: "https://argoproj.github.io/argo-helm"
argocd_values_local_path: "{{ playbook_dir }}/../../helm/argocd/values.yaml"
argocd_values_remote_path: "/home/ubuntu/helm/argocd/values.yaml"
kubeconfig_path: "/home/ubuntu/.kube/config"

# Helm
helm_version: "v4.3.0"
helm_archive: "helm-{{ helm_version }}-linux-amd64.tar.gz"
helm_url: "https://get.helm.sh/{{ helm_archive }}"
helm_install_dir: "/opt/helm/{{ helm_version }}"
helm_arch: "amd64"
helm_binary_path: "/usr/local/bin/helm"

# Traefik
traefik_chart_version: "39.0.7"
traefik_namespace: "traefik"
traefik_release_name: "traefik"
traefik_helm_repo_name: "traefik"
traefik_helm_repo_url: "https://traefik.github.io/charts"
traefik_values_local_path: "{{ playbook_dir }}/../../helm/traefik/values.yaml"
traefik_values_remote_path: "/home/ubuntu/helm/traefik/values.yaml"
