name: OpenStack Cloud-Native CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Check format
        run: terraform fmt -check -recursive terraform
      - name: Validate foundation
        working-directory: terraform/environments/lab/foundation
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate k8s cluster
        working-directory: terraform/environments/lab/k8s-cluster
        run: terraform init -backend=false -input=false && terraform validate

  ansible:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
      ANSIBLE_INVENTORY: ansible/tests/fixtures/inventory.ini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ansible tooling
        run: |
          python -m pip install 'ansible-core==2.17.13' 'ansible-lint==25.2.0' 'PyYAML==6.0.2'
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Unit test inventory
        run: python -m unittest discover -s ansible/tests -v
      - name: Syntax-check every playbook
        run: |
          set -euo pipefail
          ansible-playbook ansible/site.yml --syntax-check
          for file in ansible/playbooks/*.yml; do
            ansible-playbook "$file" --syntax-check
          done
      - name: Ansible lint
        run: ansible-lint ansible/site.yml ansible/playbooks/ ansible/roles/

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v4.3.0
      - name: Add chart repos
        run: |
          helm repo add cpo https://kubernetes.github.io/cloud-provider-openstack
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
      - name: Render Cinder CSI chart
        run: |
          helm template cinder-csi cpo/openstack-cinder-csi \
            --version 2.36.2 --namespace kube-system \
            -f helm/storage/cinder-csi-values.yaml > /tmp/cinder.yaml
          test -s /tmp/cinder.yaml
      - name: Render Monitoring chart
        run: |
          helm template monitoring prometheus-community/kube-prometheus-stack \
            --version 91.8.1 --namespace monitoring --skip-crds \
            -f helm/monitoring/values.yaml \
            -f helm/monitoring/persistence-grafana.values.yaml \
            -f helm/monitoring/persistence-alertmanager.values.yaml \
            -f helm/monitoring/persistence-prometheus.values.yaml > /tmp/monitoring.yaml
          grep -q 'storageClassName: cinder-lvm' /tmp/monitoring.yaml
