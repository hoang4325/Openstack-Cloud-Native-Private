apiVersion: v1
kind: Namespace
metadata:
  name: troubleshooting-lab
  labels:
    purpose: isolated-troubleshooting-practice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-baseline-web
  namespace: troubleshooting-lab
  labels:
    troubleshooting-case: ts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ts-baseline-web
  template:
    metadata:
      labels:
        app: ts-baseline-web
    spec:
      containers:
      - name: main
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 15m
            memory: 24Mi
          limits:
            memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ts-baseline-web
  namespace: troubleshooting-lab
  labels:
    troubleshooting-case: ts
spec:
  selector:
    app: ts-baseline-web
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: ts-baseline-client
  namespace: troubleshooting-lab
  labels:
    troubleshooting-case: ts
spec:
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 86400
