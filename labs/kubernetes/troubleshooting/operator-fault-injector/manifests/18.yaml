apiVersion: v1
kind: Service
metadata:
  name: inc18-obj01
  namespace: troubleshooting-lab
  labels:
    troubleshooting-case: l18
spec:
  selector:
    app: never-match-l18
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: inc18-obj02
  namespace: troubleshooting-lab
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`l18.lab.invalid`)
    kind: Rule
    services:
    - name: inc18-obj01
      port: 80
