apiVersion: v1
kind: Pod
metadata:
  name: inc31-obj02
  namespace: troubleshooting-lab
  labels:
    troubleshooting-case: l31
    app: inc31-obj02
spec:
  containers:
  - name: main
    image: nginx:1.27-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: inc31-obj02
  namespace: troubleshooting-lab
  labels:
    troubleshooting-case: l31
    app: inc31-obj02
spec:
  selector:
    app: inc31-obj02
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inc31-obj01
  namespace: troubleshooting-lab
  labels:
    troubleshooting-case: l31
    release: monitoring
spec:
  selector:
    matchLabels:
      app: inc31-obj02
  namespaceSelector:
    matchNames:
    - troubleshooting-lab
  endpoints:
  - port: http
    path: /not-existing-metrics
    interval: 30s
