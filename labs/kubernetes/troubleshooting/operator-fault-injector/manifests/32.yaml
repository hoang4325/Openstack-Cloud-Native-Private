apiVersion: v1
kind: Pod
metadata:
  name: inc32-obj01
  namespace: troubleshooting-lab
  labels:
    app: inc32-obj01
    troubleshooting-case: l32
spec:
  containers:
    - name: exporter
      image: python:3.12-alpine
      command:
        - python
        - -u
        - -c
        - |
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
            def do_GET(self):
              if self.path != '/metrics':
                self.send_response(404); self.end_headers(); return
              self.send_response(200)
              self.send_header('Content-Type','text/plain; version=0.0.4')
              self.end_headers()
              self.wfile.write(b'lab_heartbeat 1\n')
          HTTPServer(('0.0.0.0', 9099), H).serve_forever()
      ports:
        - name: metrics
          containerPort: 9099
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inc32-obj01
  namespace: troubleshooting-lab
  labels:
    app: inc32-obj01
    troubleshooting-case: l32
spec:
  selector:
    app: inc32-obj01
  ports:
    - name: metrics
      port: 9099
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inc32-obj02
  namespace: troubleshooting-lab
  labels:
    release: monitoring
    troubleshooting-case: l32
spec:
  selector:
    matchLabels:
      app: inc32-obj01
  namespaceSelector:
    matchNames: [troubleshooting-lab]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
